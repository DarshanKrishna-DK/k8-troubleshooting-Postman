# BROKEN Deployment - Wrong Port Configuration
# This deployment has mismatched port configuration
# Result: Health probes fail because they check the wrong port
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
      - name: demo-api
        image: k8s-demo-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: APP_NAME
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: DB_HOST
        - name: FAILURE_RATE
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: FAILURE_RATE
        
        # ❌ WRONG PORT in probes!
        livenessProbe:
          httpGet:
            path: /health
            port: 8080  # ❌ App runs on 3000, not 8080!
          initialDelaySeconds: 10
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080  # ❌ App runs on 3000, not 8080!
          initialDelaySeconds: 5
          periodSeconds: 5
        
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"

