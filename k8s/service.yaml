# Service - Exposes the deployment to network traffic
apiVersion: v1
kind: Service
metadata:
  name: demo-api-service
  namespace: demo
  labels:
    app: demo-api
spec:
  type: NodePort  # Exposes service on each node's IP at a static port
  selector:
    app: demo-api  # Routes traffic to pods with this label
  ports:
  - name: http
    port: 80           # Port exposed by the service
    targetPort: 3000   # Port on the container
    nodePort: 30080    # Port on the node (accessible from outside)

